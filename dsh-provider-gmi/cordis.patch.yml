# GMI Cloud provider bundle for DeepSeek Harness.
#
# GENERATED from lib/models.mjs by `npm run gen` — edit that table, not this file.
#
# Configures DSH's stock llm-pi-ai adapter with GMI Cloud's OpenAI-compatible
# Inference Engine. The key stays a credential reference (GMI_API_KEY), so no
# secret is ever written into this file or into your profile.
#
# More GMI models: Settings -> Models -> GMI Cloud -> fetch available models,
# or `npx dsh-provider-gmi models` to list what your key can reach.

- id: llm-pi-ai
  config:
    providers:
      gmi:
        displayName: "GMI Cloud"
        apiKeyEnv: GMI_API_KEY
        api: openai-completions
        baseURL: "https://api.gmi-serving.com/v1"
        defaultContextWindow: 262144
        defaultMaxTokens: 65536
        defaultInput: [text]
        models:
          # Default pick for everyday agent work.
          - id: "deepseek-ai/DeepSeek-V4.1-Flash"
            name: "DeepSeek V4.1 Flash · GMI"
            contextWindow: 1048575
            maxTokens: 131072
            input: [text]
            reasoningEfforts:
              off:
              high: "high"
              max: "max"
            compat:
              thinkingFormat: deepseek
              supportsReasoningEffort: true
          # Dated snapshot of DeepSeek V4 Pro for harder tasks.
          - id: "deepseek-ai/DeepSeek-V4-Pro-0813"
            name: "DeepSeek V4 Pro 0813 · GMI"
            contextWindow: 1048575
            maxTokens: 131072
            input: [text]
            reasoningEfforts:
              off:
              high: "high"
              max: "max"
            compat:
              thinkingFormat: deepseek
              supportsReasoningEffort: true
          # Lightweight option for quick edits and subagents.
          - id: "deepseek-ai/DeepSeek-V4-Flash"
            name: "DeepSeek V4 Flash · GMI"
            contextWindow: 1048575
            maxTokens: 131072

# One-off: publish dsh-provider-gmi (staged in ./dsh-provider-gmi) to npm with
# this repository's NPM_TOKEN, until the package has its own repository and
# release workflow. Idempotent: skips when this version is already on npm.
name: publish dsh-provider-gmi

on:
  push:
    branches: [claude/zen-rubin-qd3e5i]
    paths:
      - 'dsh-provider-gmi/**'
      - '.github/workflows/publish-gmi-provider.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-provider-gmi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Test
        run: npm test

      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish unless this version exists
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "dsh-provider-gmi@$version" version >/dev/null 2>&1; then
            echo "dsh-provider-gmi@$version is already on npm; nothing to do."
            exit 0
          fi
          npm publish --access public
          npm view dsh-provider-gmi name version dist.tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
